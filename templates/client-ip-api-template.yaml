apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: client-ip-api-template
objects:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: ${NAMESPACE}

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${APP_NAME}
    # Namespace deste objeto; não confundir com seleção de namespaces de origem.
    # Namespace deste objeto; não confundir com seleção de namespaces de origem.
    namespace: ${NAMESPACE}
  spec:
    # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
    # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
    replicas: 1
    # Seletores precisam corresponder aos labels dos recursos de destino.
    # Seletores precisam corresponder aos labels dos recursos de destino.
    selector:
      matchLabels:
        app: ${APP_NAME}
    template:
      metadata:
        labels:
          app: ${APP_NAME}
      spec:
        containers:
          - name: ${APP_NAME}
            image: ${IMAGE}
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8080
            # Prontidão controla recebimento de tráfego, sem provar integrações externas.
            # Prontidão controla recebimento de tráfego, sem provar integrações externas.
            readinessProbe:
              httpGet:
                path: /healthz
                port: http
            # Falha desta sonda pode reiniciar o container; evite depender de serviços externos.
            # Falha desta sonda pode reiniciar o container; evite depender de serviços externos.
            livenessProbe:
              httpGet:
                path: /healthz
                port: http
              initialDelaySeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            # Restringe privilégios do processo; conferir compatibilidade com a SCC.
            # Restringe privilégios do processo; conferir compatibilidade com a SCC.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

- apiVersion: v1
  kind: Service
  metadata:
    name: ${APP_NAME}
    namespace: ${NAMESPACE}
  spec:
    selector:
      app: ${APP_NAME}
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: http

- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: ${APP_NAME}
    namespace: ${NAMESPACE}
  spec:
    to:
      kind: Service
      name: ${APP_NAME}
    port:
      targetPort: http
    # TLS define transporte e confiança; não desabilitar validação para contornar erros.
    # TLS define transporte e confiança; não desabilitar validação para contornar erros.
    tls:
      termination: edge

parameters:
  - name: APP_NAME
    description: Nome da aplicação (usado nos objetos)
    value: client-ip-api

  - name: NAMESPACE
    description: Namespace onde a aplicação será provisionada
    value: client-ip-api

  - name: IMAGE
    description: Imagem imutável recomendada (tag de versão ou digest)
    value: quay.io/thiagobotelho/client-ip-api@sha256:752c540a5c75abb2a5f4862c3dad499b615cf5d347b95626c96968b5863bcc40
